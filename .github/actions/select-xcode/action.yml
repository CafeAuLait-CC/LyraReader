# Select the newest Xcode whose Swift compiler is 6.2 or newer.
#
# apps/macos/Package.swift declares swift-tools-version 6.0, but the sources need a Swift 6.2
# compiler: `isolated deinit` in Sources/LyraReaderKit/PDFCanvasView.swift. Both runner defaults
# were real CI failures — macos-14's Xcode 15.4/Swift 5.10 cannot even load the manifest, and
# macos-15's default Xcode 16.4/Swift 6.1 fails with "consecutive declarations on a line must be
# separated by ';'" at that deinit. Rather than pin a path, take the newest Xcode whose Swift is
# at least 6.2 and fail loudly here if the image ever ships none.
#
# This lives in a composite action so the selection logic and the incident above stay in one
# unit instead of a snippet that gets copied (and slowly drifts) between jobs. macos-build uses
# it; any future Swift job should too.
name: Select an Xcode with Swift >= 6.2
description: Select the newest Xcode with a Swift 6.2+ compiler and export DEVELOPER_DIR

outputs:
  swift_version:
    description: The selected compiler's Swift version (for example 6.2.4), used in cache keys
    value: ${{ steps.select.outputs.swift_version }}

runs:
  using: composite
  steps:
    - name: Select an Xcode with Swift >= 6.2
      id: select
      shell: bash
      run: |
        set -euo pipefail
        DEVELOPER=""
        for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr); do
          version="$(DEVELOPER_DIR="$app/Contents/Developer" swift --version 2>/dev/null \
            | sed -nE 's/.*Swift version ([0-9]+\.[0-9]+).*/\1/p' | head -1 || true)"
          [ -n "$version" ] || continue
          if [ "$(printf '%s\n6.2\n' "$version" | sort -V | head -1)" = "6.2" ]; then
            DEVELOPER="$app/Contents/Developer"
            break
          fi
        done
        if [ -z "$DEVELOPER" ]; then
          echo "::error::this image ships no Xcode with Swift >= 6.2, which the sources need (isolated deinit in PDFCanvasView.swift)"
          exit 1
        fi
        export DEVELOPER_DIR="$DEVELOPER"
        echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
        swift --version
        echo "swift_version=$(swift --version | head -1 \
          | sed -nE 's/.*Swift version ([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p' | head -1)" >> "$GITHUB_OUTPUT"
