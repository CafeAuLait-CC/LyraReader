[package]
name = "lyra-reader-gpu"
description = "GPU abstraction: wgpu device/surface/compositor, sharing MTLDevice with the native layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lyra-reader-core = { workspace = true }

# GPU abstraction (docs/adr/0003). Only the Metal backend is compiled on macOS;
# the same code path drives DX12 on Windows and Vulkan on Linux later. `wgsl` is
# needed because shaders are compiled at runtime (no metallib, see ADR-0006).
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }
