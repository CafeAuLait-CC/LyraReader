[package]
name = "lyra-reader-ai"
description = "AI layer: LLM provider abstraction, context building, citation/figure index (independent of any concrete model)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lyra-reader-core = { workspace = true }
# The document-knowledge block and its character counters keep the pre-refactor Swift unit:
# extended grapheme clusters, not Unicode scalars.
unicode-segmentation = { workspace = true }
serde_json = "1"
# The layered summary cache is keyed by a hash of exactly the page text a request sends, so
# editing one section invalidates that section and nothing else. SHA-256 is already in the
# workspace through the document layer; using the same digest keeps the key stable.
sha2 = "0.11"
# One synchronous client for http:// and https://. rustls is the TLS provider; the bundled
# webpki roots are only a fallback when the OS trust store cannot be loaded.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
rustls-native-certs = "0.8"

[dev-dependencies]
# A loopback TLS server with a generated CA, so the HTTPS path is exercised by a test rather
# than only by the system-trust path at runtime.
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }

# The AI layer runs on plain OS threads and a blocking client: one worker per request, with a
# cancellation flag checked between short socket reads. That keeps the crate independent of an
# async runtime and makes cancellation exercisable on every platform.
