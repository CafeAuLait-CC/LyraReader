[package]
name = "lyra-reader-cli"
description = "Headless CLI: render pages to images, export text, run benchmarks (also the entry point for golden tests)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "lyra-reader-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
lyra-reader-text = { path = "../lyra-reader-text" }
lyra-reader-metadata = { workspace = true }
lyra-reader-core = { workspace = true }
lyra-reader-pdfium = { workspace = true }
lyra-reader-render = { workspace = true }
# PNG encode/decode for the `render` and `compare` subcommands. Deliberately kept
# out of the engine crates: the engine deals in raw pixel buffers only.
image = { version = "0.25", default-features = false, features = ["png"] }
# `bench` reports peak RSS through `getrusage(RUSAGE_SELF)`: the kernel's own high-water
# mark, which a sampler can miss and a profiler is not always available for.
libc = "0.2"
# `eval` writes and reads a versioned JSON baseline. Both crates are already in the tree
# (the FFI and AI crates depend on them); this only adds the CLI as a consumer.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
