[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Alex"]
description = "LyraReader — native macOS PDF reader (Rust engine + GPU compositing + SwiftUI interface)"

[workspace.dependencies]
# ── Internal crates ───────────────────────────────────────────────────────────
lyra-reader-core    = { path = "crates/lyra-reader-core" }
lyra-reader-pdfium  = { path = "crates/lyra-reader-pdfium" }
lyra-reader-text    = { path = "crates/lyra-reader-text" }
lyra-reader-edit    = { path = "crates/lyra-reader-edit" }
lyra-reader-render  = { path = "crates/lyra-reader-render" }
lyra-reader-gpu     = { path = "crates/lyra-reader-gpu" }
lyra-reader-session = { path = "crates/lyra-reader-session" }
lyra-reader-ai      = { path = "crates/lyra-reader-ai" }
lyra-reader-ffi     = { path = "crates/lyra-reader-ffi" }
lyra-reader-metadata = { path = "crates/lyra-reader-metadata" }

# ── External dependencies (from M1; versions in docs/09-dev-setup.md) ─────────
# wgpu          = "30"          # GPU abstraction (Metal / Vulkan / DX12)
# pdfium-render = "0.9"         # Safe PDFium wrapper (feature = "thread_safe")
# tokio         = "1"           # AI/async (M5)
# lyon          = "1"           # Path tessellation (M3 annotation rendering)
# thiserror     = "2"           # Error definitions
# tracing       = "0.1"         # Logging and instrumentation
# uniffi        = "0.32"        # FFI binding generation (M0 T0.8)

[workspace.lints.rust]
unsafe_code = "warn"
# missing_docs = "warn"   # TODO(X.4): enable during implementation

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "allow"            # Many TODO anchors during the skeleton phase

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"          # The FFI boundary needs unwind to turn panics into error returns

[profile.dev]
opt-level = 1             # PDFium rasterization is CPU-bound, so dev builds need usable speed too

[profile.dev.package."*"]
opt-level = 3             # Dependencies are always compiled with optimizations
